[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intel_assignment"
version = "0.1.0"
description = "Framework-independent model graph visualization pipeline"
requires-python = ">=3.11"
dependencies = [
    "openvino>=2026.0",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
